project_id = "cfmzkthhgliqelozlmwu"

# Endpoint legado inerte. A barreira do gateway impede chamadas anônimas e o
# handler nunca lê credenciais nem altera contas.
[functions.verify-email]
verify_jwt = true

# Estas duas funções validam o JWT dentro do handler. O gateway permanece sem
# validação para aceitar tanto chaves JWT legadas quanto publishable keys.
[functions.expert-chat]
verify_jwt = false

[functions.external-db-bridge]
verify_jwt = false

# `crm-db-bridge` entra na allowlist de publicação nesta PR. Sem esta entrada,
# `supabase functions deploy` aplicaria o padrão do CLI (gateway fechado) e
# mataria o `?op=ping`, que o handler responde ANTES de qualquer autenticação
# (`supabase/functions/crm-db-bridge/index.ts:1096-1098`, "PING público expõe
# somente saúde agregada"). `src/lib/external-db-prewarm.ts:41` depende dele
# inclusive quando o token de sessão expirou. Os demais `op` continuam exigindo
# JWT e papel `dev` dentro do handler, logo a barreira não se perde.
[functions.crm-db-bridge]
verify_jwt = false

# Estes handlers mantêm a dupla barreira: gateway e validação auth.getUser.
[functions.sicoob-kit-quote]
verify_jwt = true

[functions.sicoob-reorder]
verify_jwt = true

[functions.migrate-helper]
verify_jwt = false

[functions.sicoob-approval-notifications]
verify_jwt = false

[functions.quote-approval]
verify_jwt = false

# O salvamento de orçamento exige JWT válido também no gateway.
[functions.quote-price-attestation]
verify_jwt = true

# Chamadas de cron/Edge são autenticadas no próprio código pelo segredo
# INTERNAL_FUNCTION_SECRET. A verificação explícita evita depender de estado
# antigo do gateway e falha fechada se o segredo não estiver configurado.
[functions.send-notification]
verify_jwt = false

[functions.process-batch-export]
verify_jwt = false

[functions.monthly-health-report]
verify_jwt = false

# Serviços assíncronos não aceitam JWT público: todos verificam
# INTERNAL_FUNCTION_SECRET antes de instanciar qualquer cliente service_role.
[functions.cleanup-notifications]
verify_jwt = false

[functions.process-queue]
verify_jwt = false

[functions.send-digest]
verify_jwt = false

[functions.process-scheduled-reports]
verify_jwt = false

[functions.send-scheduled-reports]
verify_jwt = false

[functions.quote-followup-reminders]
verify_jwt = false

[functions.connections-health-check]
verify_jwt = false

[functions.collections-watcher]
verify_jwt = false

[functions.favorites-watcher]
verify_jwt = false

[functions.comparison-price-watcher]
verify_jwt = false

[functions.ownership-audit]
verify_jwt = false

# Disparo de integração autentica cron/Edge por WEBHOOK_DISPATCHER_SECRET;
# teste e replay usam JWT de supervisor no próprio handler.
[functions.webhook-dispatcher]
verify_jwt = false

# Liveness publico para uptime monitors; sem dependencias internas.
[functions.health-check]
verify_jwt = false

# Recebe webhook de sistema externo: quem chama nao tem JWT do Supabase, a
# autenticidade vem do HMAC por endpoint (`hmac_secret_ref`) validado no
# handler. Sem esta declaracao o deploy pela CLI aplica o padrao
# `verify_jwt = true` e passa a recusar o emissor externo com 401 — foi o que a
# sonda em producao mostrou nao acontecer hoje (chamada sem cabecalho de
# autorizacao chega ao handler e responde 404 do slug inexistente).
[functions.webhook-inbound]
verify_jwt = false

# Gateway exige JWT; a autorizacao fina continua no proprio handler.
[functions.sicoob-artwork-register]
verify_jwt = true

[functions.sicoob-document-ingest]
verify_jwt = true

[functions.sicoob-approval-reconciliation]
verify_jwt = true

[functions.external-connections-sync]
verify_jwt = true
