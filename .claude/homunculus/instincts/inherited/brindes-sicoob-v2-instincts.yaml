# Brindes Sicoob V2 Commit Conventional

## Action

Use conventional commit format in PT-BR with the prefixes actually in use: fix, docs, chore, infra, feat, ci

## Evidence

- `git log --format=%s` na main (50 commits): fix 26 · docs 10 · chore 7 · infra 3 · feat 2 · ci 1
- Padrão documentado em `CONTRIBUTING.md` > "Commits" (Conventional Commits)
- Não há hook `commit-msg` neste repo — o padrão não é cobrado por máquina

