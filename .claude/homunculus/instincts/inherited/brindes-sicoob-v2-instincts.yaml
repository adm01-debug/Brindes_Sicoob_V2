# Brindes Sicoob V2 Test Separate

## Action

Unit tests go in tests/ mirroring src/ (Vitest); browser flows go in e2e/ (Playwright)

## Evidence

- `tests/` com subpastas espelhando `src/` (components/, hooks/, services/, utils/, edge-functions/, scenarios/)
- `e2e/flows/` com os specs Playwright; `npm run test` = `vitest run`

