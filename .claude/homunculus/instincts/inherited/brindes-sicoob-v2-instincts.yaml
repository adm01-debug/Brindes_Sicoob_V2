# Brindes Sicoob V2 Migration Immutable

## Action

Never edit a migration already merged into main; add a new migration with the delta

## Evidence

- `CONTRIBUTING.md` > "Migrations Supabase" > Imutabilidade
- `scripts/check-migration-immutability.mjs` bloqueia no CI comparando contra `origin/main`
