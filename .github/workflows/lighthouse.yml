name: Lighthouse Performance Audit

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Locate Chromium (self-hosted runner)
        run: |
          if [ -x "/opt/pw-browsers/chromium" ]; then
            echo "CHROME_PATH=/opt/pw-browsers/chromium" >> "$GITHUB_ENV"
          elif which google-chrome > /dev/null 2>&1; then
            echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          else
            echo "CHROME_PATH=$(which chromium || which chromium-browser)" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:59999
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-sintetica-apenas-para-build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.13.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: ${{ env.CHROME_PATH }}

      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
