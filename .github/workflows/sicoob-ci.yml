name: Sicoob Module CI

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/sicoob/**'
      - 'src/components/layout/ProtectedRoute*'
      - 'src/services/sicoob/**'
      - 'src/hooks/useSicoob*'
      - 'supabase/functions/tests/sicoob-*'
      - 'vitest.config.ts'
      - '.github/workflows/sicoob-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/sicoob/**'
      - 'src/components/layout/ProtectedRoute*'
      - 'src/services/sicoob/**'
      - 'src/hooks/useSicoob*'
      - 'supabase/functions/tests/sicoob-*'
      - 'vitest.config.ts'
      - '.github/workflows/sicoob-ci.yml'

jobs:
  rls-security-gate:
    name: Sicoob RLS & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Sicoob RLS Validation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "⚠️ SUPABASE_DB_URL not set, skipping DB-level RLS tests"
            exit 0
          fi
          deno test --allow-net --allow-env --allow-read supabase/functions/tests/sicoob-rls-validation_test.ts

      - name: Run Sicoob RLS Coverage (Cross-Role)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "⚠️ SUPABASE_DB_URL not set, skipping DB-level coverage tests"
            exit 0
          fi
          deno test --allow-net --allow-env --allow-read supabase/functions/tests/sicoob-rls-coverage_test.ts

      - name: Run Sicoob Validation Constraints
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "⚠️ SUPABASE_DB_URL not set, skipping DB-level constraint tests"
            exit 0
          fi
          deno test --allow-net --allow-env --allow-read supabase/functions/tests/sicoob-validation-constraints_test.ts

  frontend-unit-coverage:
    name: Frontend Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run Frontend Tests with Coverage
        run: npm run test -- src/components/layout/ProtectedRoute.test.tsx src/services/sicoob/orderService.test.ts src/pages/ForbiddenPage.test.tsx

