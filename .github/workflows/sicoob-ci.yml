name: Portal Sicoob

on:
  push:
    branches: [main]
    paths: &sicoob_paths
      - 'src/pages/Auth.tsx'
      - 'src/pages/auth/**'
      - 'src/pages/sicoob/**'
      - 'src/components/a11y/**'
      - 'src/components/layout/**'
      - 'src/contexts/AuthContext.tsx'
      - 'src/hooks/useSicoob*'
      - 'src/hooks/auth/**'
      - 'src/lib/access/**'
      - 'src/lib/auth/**'
      - 'src/services/sicoob/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/sicoob/**'
      - 'tests/services/sicoobOrderService.test.ts'
      - 'scripts/qa/**'
      - 'e2e/pwa-resilience.spec.ts'
      - 'playwright.pwa.config.ts'
      - 'public/sw.js'
      - 'public/offline.html'
      - '.github/workflows/sicoob-ci.yml'
  pull_request:
    branches: [main]
    paths: *sicoob_paths

permissions:
  contents: read

concurrency:
  group: sicoob-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transacoes:
    name: Verba e aprovação transacionais
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executar PostgreSQL isolado e casos concorrentes
        run: |
          python3 scripts/qa/simular-verba-atomica.py
          python3 scripts/qa/simular-eventos-status-sicoob.py
          python3 scripts/qa/simular-politica-aprovacao-sicoob.py
          python3 scripts/qa/simular-versionamento-orcamento-atomico.py
          python3 scripts/qa/simular-recompra-sicoob.py
          python3 scripts/qa/simular-kit-orcamento-sicoob.py
          python3 scripts/qa/simular-financeiro-arte-sicoob.py
          python3 scripts/qa/simular-consolidacao-sicoob.py

  experiencia:
    name: Entrada e demonstração responsivas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Iniciar servidor local sintético
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:59999
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-sintetica-apenas-para-qa
        run: |
          npm run dev -- --host 127.0.0.1 --port 4178 > /tmp/portal-sicoob-vite.log 2>&1 &
          for tentativa in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4178/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portal-sicoob-vite.log
          exit 1
      - name: Validar WCAG, responsividade e execução
        run: |
          npm run qa:visual:login
          npm run qa:visual:demo
      - name: Validar instalação e fallback offline da PWA em build de produção
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:59999
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-sintetica-apenas-para-qa
        run: npm run test:e2e:pwa
      - name: Publicar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-visuais-sicoob
          path: docs/execucao/evidencias/visual/
          retention-days: 7
