name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          # A análise e o SARIF devem existir mesmo quando o painel de code
          # scanning não está habilitado para este repositório privado.
          upload: never

      - name: Preservar resultado SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Publicar resultado no painel de segurança
        if: vars.CODEQL_UPLOAD_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
