name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/CODEOWNERS'
      - 'reports/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/CODEOWNERS'
      - 'reports/**'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O runner self-hosted ainda expõe Node 12 no PATH. O analisador
      # JavaScript/TypeScript atual do CodeQL exige uma versão suportada.
      - name: Preparar Node.js para análise
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results
          # O repositório privado não possui GitHub Code Scanning habilitado.
          # Mantemos a análise e preservamos o SARIF como artefato auditável.
          upload: never

      - name: Validar que a análise gerou SARIF
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('sarif-results/*.sarif')
          if not files:
              sys.exit('CodeQL não gerou arquivo SARIF.')
          runs = sum((json.load(open(path, encoding='utf-8')).get('runs', []) for path in files), [])
          if not runs:
              sys.exit('CodeQL gerou SARIF sem execução analisável.')
          print(f'CodeQL gerou {len(files)} SARIF com {len(runs)} execução(ões).')
          PY

      - name: Preservar resultado SARIF como artefato
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: warn
          retention-days: 14
