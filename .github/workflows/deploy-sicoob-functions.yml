name: Publicar funções Sicoob

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PUBLICAR para enviar as funções ao ambiente de construção'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirmar == 'PUBLICAR' && github.ref == 'refs/heads/main'
    name: Publicar funções canônicas Sicoob
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: construction
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Baixar fonte versionada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0

      - name: Validar credenciais de publicação
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Publicar funções Sicoob
        run: |
          set -euo pipefail
          functions=(
            expert-chat
            external-db-bridge
            sicoob-approval-reconciliation
            sicoob-artwork-register
            sicoob-document-ingest
            sicoob-kit-quote
            sicoob-reorder
          )
          printf '%s\n' "${functions[@]}" > /tmp/functions-expected.txt
          : > /tmp/functions-no-change.txt
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output-format json > /tmp/functions-before.json
          while IFS= read -r function_name; do
            if ! deploy_output="$(supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID" 2>&1)"; then
              printf '%s\n' "$deploy_output"
              exit 1
            fi
            printf '%s\n' "$deploy_output"
            if grep -Fqx -- "No change found in Function: $function_name" <<< "$deploy_output"; then
              printf '%s\n' "$function_name" >> /tmp/functions-no-change.txt
            fi
          done < /tmp/functions-expected.txt

      - name: Confirmar funções publicadas
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output-format json > /tmp/functions-after.json
          node scripts/verify-supabase-function-deploy.mjs \
            /tmp/functions-before.json \
            /tmp/functions-after.json \
            /tmp/functions-no-change.txt \
            /tmp/functions-expected.txt
