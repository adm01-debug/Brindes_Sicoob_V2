name: Publicar funções Sicoob

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PUBLICAR para enviar as funções ao ambiente de construção'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirmar == 'PUBLICAR' && github.ref == 'refs/heads/main'
    name: Publicar funções canônicas Sicoob
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: construction
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Baixar fonte versionada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validar credenciais de publicação
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Validar contrato local de runtime
        run: node scripts/deploy-edge-functions.mjs

      - name: Publicar e reconciliar funções canônicas
        run: |
          set -euo pipefail
          node scripts/deploy-edge-functions.mjs \
            --deploy \
            --confirm PUBLICAR \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --report artifacts/edge-deployment-report.json

      - name: Preservar evidência da publicação
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-deployment-report
          path: artifacts/edge-deployment-report.json
          if-no-files-found: warn
