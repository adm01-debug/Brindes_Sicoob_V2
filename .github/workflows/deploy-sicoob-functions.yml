name: Publicar funções Sicoob

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PUBLICAR para enviar as funções ao ambiente de construção'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirmar == 'PUBLICAR' && github.ref == 'refs/heads/main'
    name: Publicar funções canônicas Sicoob
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: construction
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Baixar fonte versionada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0

      - name: Validar credenciais de publicação
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Publicar funções Sicoob
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output-format json > /tmp/functions-before.json
          for function_name in \
            expert-chat \
            external-db-bridge \
            sicoob-approval-reconciliation \
            sicoob-artwork-register \
            sicoob-document-ingest \
            sicoob-kit-quote \
            sicoob-reorder
          do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done

      - name: Confirmar funções publicadas
        run: |
          set -euo pipefail
          published_functions="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output-format json)"
          for function_name in \
            expert-chat \
            external-db-bridge \
            sicoob-approval-reconciliation \
            sicoob-artwork-register \
            sicoob-document-ingest \
            sicoob-kit-quote \
            sicoob-reorder
          do
            previous_version="$(jq -r --arg function_name "$function_name" '[(.functions // .)[] | select(.slug == $function_name) | .version] | first // 0' /tmp/functions-before.json)"
            current_version="$(echo "$published_functions" | jq -r --arg function_name "$function_name" '[(.functions // .)[] | select(.slug == $function_name) | .version] | first // 0')"
            current_status="$(echo "$published_functions" | jq -r --arg function_name "$function_name" '[(.functions // .)[] | select(.slug == $function_name) | .status] | first // "MISSING"')"
            # O CLI não cria uma versão nova quando o bundle já está idêntico.
            # A etapa de deploy já falha em caso de erro; aqui exigimos função ativa
            # e impedimos regressão, aceitando uma versão igual como no-op válido.
            if ! [[ "$current_version" =~ ^[0-9]+$ ]] \
              || (( current_version == 0 )) \
              || [[ "$current_status" != "ACTIVE" ]] \
              || (( current_version < previous_version )); then
              echo "::error title=Publicação não confirmada::$function_name ausente, inativa ou com versão regredida (versão: $current_version, anterior: $previous_version, status: $current_status)."
              exit 1
            fi
          done
