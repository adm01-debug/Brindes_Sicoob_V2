name: Bundle Size Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bundle-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run bundle-stats
        run: |
          npx bundle-stats build --out-dir bundle-stats
      
      - name: Check for large chunks
        run: |
          # Fail if any file in dist/assets is > 600KB (gzipped usually smaller, but this is raw)
          # We check the size and print a recommendation if it exceeds 500KB
          find dist/assets -name "*.js" -size +500k | while read -r file; do
            echo "::warning file=$file::Large chunk detected. Consider using manualChunks or lazy loading for this module."
          done
          
          # Hard failure at 800KB for critical performance paths
          if find dist/assets -name "*.js" -size +800k | grep -q .; then
            echo "::error::Bundle contains chunks larger than 800KB. Build failing."
            exit 1
          fi

      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: bundle-stats

