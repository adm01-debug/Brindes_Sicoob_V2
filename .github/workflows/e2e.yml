name: E2E (Playwright)

# Gate de release: exige as contas de homologação e executa jornadas públicas
# e autenticadas. Artefatos (HTML, screenshots, vídeos e traces) são publicados.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: self-hosted
    # Gate curto e determinístico. A regressão completa roda em shards no job
    # seguinte, para não deixar que uma suíte extensa oculte uma falha básica.
    timeout-minutes: 15
    env:
      CI: 'true'
      # Logs limpos no GitHub Actions: sem códigos ANSI no console output
      # (relatório HTML continua colorido). Reporters dedicados (github/list)
      # cuidam da formatação amigável.
      FORCE_COLOR: '0'
      # Falha imediatamente se algum spec ainda tiver `test.only` esquecido.
      PWTEST_FORBID_ONLY: '1'
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Verificar credenciais da jornada autenticada
        shell: bash
        run: |
          if [[ -z "$E2E_USER_EMAIL" || -z "$E2E_USER_PASSWORD" || -z "$E2E_ADMIN_EMAIL" || -z "$E2E_ADMIN_PASSWORD" ]]; then
            echo "::warning title=Credenciais E2E ausentes::Configure E2E_USER_EMAIL, E2E_USER_PASSWORD, E2E_ADMIN_EMAIL e E2E_ADMIN_PASSWORD nos secrets do repositório para habilitar o smoke gate autenticado."
            echo "SKIP_E2E=true" >> "$GITHUB_ENV"
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Auditoria: garante que docs/E2E_SMOKE_COVERAGE.md está em dia com
      # _catalog.ts + SMOKE_COVERAGE. Falha se alguém alterou a suíte sem
      # regenerar o doc (`npm run e2e:smoke-coverage-doc`).
      - name: Validar doc de auditoria do smoke (drift check)
        run: node scripts/e2e-smoke-coverage-doc.mjs --check

      # Garante que TODO test() no spec do smoke está sob describe @smoke.
      # Tests fora de describe @smoke seriam silenciosamente IGNORADOS pelo
      # gate (project chromium-smoke usa `grep: /@smoke/`). Falha CI cedo.
      - name: 🏷  Validar tags @smoke no spec do gate
        run: node scripts/check-smoke-tags.mjs

      # ─── SMOKE: fail-fast agressivo ─────────────────────────────────────
      # `--max-failures=1` para na PRIMEIRA falha (gate determinístico —
      # qualquer falha do smoke invalida o run; rodar mais é desperdício).
      # `--forbid-only` falha se algum spec tem `test.only` esquecido.
      # Reporter `github` emite annotations clicáveis no PR; `list` é
      # human-friendly no log; `json` alimenta o summary script.
      - name: Run E2E smoke (gate — para na 1ª falha)
        id: e2e_smoke
        if: env.SKIP_E2E != 'true'
        run: |
          npx playwright test \
            --project=chromium-smoke \
            --max-failures=1 \
            --forbid-only \
            --reporter=github,list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        continue-on-error: true

      # Resumo dedicado do smoke: 1 linha por funcionalidade no log do step,
      # `::error file=...::` por falha (anotação inline no PR), `::group::`
      # colapsável para diagnóstico, e bloco "FINAL SUMMARY" sem ANSI no fim.
      - name: 📋 Generate SMOKE summary (sempre — log final + annotations)
        if: always()
        run: node scripts/e2e-smoke-summary.mjs || true

      - name: 📤 Append SMOKE summary to GitHub UI
        if: always() && hashFiles('playwright-report/smoke-summary.md') != ''
        run: |
          {
            echo "## 🚦 E2E Smoke Summary"
            echo ""
            cat playwright-report/smoke-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛑 Fail-fast se smoke falhou (gate)
        if: env.SKIP_E2E != 'true' && steps.e2e_smoke.outcome != 'success'
        run: |
          echo "::error title=Smoke gate failed::Smoke parou na 1ª falha — veja '🚦 E2E Smoke Summary' acima e o artifact 'playwright-report' (screenshots+vídeos+trace)."
          exit 1

      # ─── HEADER STICKY GATE ─────────────────────────────────────────────
      - name: 🧲 Run E2E header-sticky gate (fail-fast por rota/viewport)
        id: e2e_header_sticky
        if: env.SKIP_E2E != 'true' && steps.e2e_smoke.outcome == 'success'
        run: |
          npx playwright test \
            e2e/flows/22-header-sticky.spec.ts \
            --max-failures=1 \
            --reporter=github,list
        continue-on-error: true

      - name: 🛑 Fail-fast se header sticky falhou
        if: env.SKIP_E2E != 'true' && steps.e2e_header_sticky.outcome == 'failure'
        run: |
          echo "::error title=Header sticky regression::O Header global deixou de ser sticky em alguma rota/viewport. Spec: e2e/flows/22-header-sticky.spec.ts. Causa raiz típica: 'overflow' / 'transform' / 'filter' em ancestral do <header> em src/components/layout/MainLayout.tsx criando scroll container ou stacking context indevido. Veja o artifact 'playwright-report' (screenshot + vídeo + trace) para a rota específica."
          exit 1

      - name: Upload Playwright report do gate
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-smoke-gate
          path: playwright-report
          retention-days: 7

      - name: Upload smoke summary (markdown + json)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-smoke-summary
          path: |
            playwright-report/smoke-summary.md
            playwright-report/smoke-summary.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload evidências do gate
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-evidence-smoke-gate
          path: |
            e2e-artifacts
            test-results
          retention-days: 7

  e2e-regression:
    name: E2E regression — shard ${{ matrix.shard }}/2
    needs: e2e
    if: needs.e2e.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      PWTEST_FORBID_ONLY: '1'
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      # SEM --max-failures: cada shard registra todas as falhas de sua parte.
      # O gate anterior já validou o smoke e a ausência de test.only.
      - name: Run E2E regression (shard ${{ matrix.shard }}/2)
        run: |
          npx playwright test \
            --grep-invert @smoke \
            --shard=${{ matrix.shard }}/2 \
            --workers=2 \
            --pass-with-no-tests \
            --reporter=github,line,html,json,junit
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-report/results.xml
        continue-on-error: true
        id: e2e_run

      - name: 📋 Generate feature summary (regression)
        if: always()
        run: node scripts/e2e-feature-summary.mjs || true

      - name: 📤 Append feature summary to GitHub UI
        if: always() && hashFiles('playwright-report/feature-summary.md') != ''
        run: |
          {
            echo "## 🧪 E2E Feature Summary — shard ${{ matrix.shard }}/2"
            echo ""
            cat playwright-report/feature-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

      - name: Upload feature summary (markdown)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-feature-summary-shard-${{ matrix.shard }}
          path: playwright-report/feature-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-evidence-shard-${{ matrix.shard }}
          path: |
            e2e-artifacts
            test-results
          retention-days: 7

      - name: 🛑 Fail job se regression registrou falhas
        if: steps.e2e_run.outcome == 'failure'
        run: |
          echo "::error title=Regression failed::Algumas specs do shard ${{ matrix.shard }}/2 falharam — veja o resumo acima e os artifacts do shard (HTML, screenshots, vídeos e trace)."
          exit 1
