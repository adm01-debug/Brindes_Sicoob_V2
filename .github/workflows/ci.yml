name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # Enquanto a dívida de tipagem (strict + noUncheckedIndexedAccess) é
      # zerada arquivo a arquivo, o gate compara com `.typecheck-baseline.json`:
      # nenhum arquivo pode piorar e arquivos novos precisam nascer limpos.
      # Quando o baseline chegar a 0, trocar por `bun run typecheck`.
      - name: Typecheck (baseline gate)
        run: bun run typecheck:baseline

      - name: Edge Authorization Gate
        run: node scripts/check-edge-authorization.mjs

      - name: Unit, Integration & Fuzz Tests
        run: |
          bun run test:coverage:ci
          bun run test:fuzzing

      - name: Webhook Simulation & Load Test
        run: |
          bun run test:simulation
          bun run test:load
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          WEBHOOK_HMAC_SECRET: ${{ secrets.WEBHOOK_HMAC_SECRET }}

      - name: Edge Function Tests
        run: deno test --allow-all supabase/functions/tests/



      - name: Build Check
        run: bun run build

      - name: E2E Tests (Smoke)
        run: |
          npx playwright install --with-deps chromium
          bun run smoke
