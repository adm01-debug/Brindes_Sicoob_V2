name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Lint & Typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Unit, Integration & Fuzz Tests
        run: bun run test:coverage:ci

      - name: Edge Function Tests
        run: deno test --allow-all supabase/functions/tests/


      - name: Build Check
        run: bun run build

      - name: E2E Tests (Smoke)
        run: |
          npx playwright install --with-deps chromium
          bun run smoke
