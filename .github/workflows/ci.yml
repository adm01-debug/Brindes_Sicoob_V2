name: Qualidade contínua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Segurança, contratos e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Bloquear regressões conhecidas de tipagem
        run: npm run typecheck:baseline

      - name: Bloquear regressões de lint contra a branch-base
        run: npm run lint:baseline

      - name: Bloquear edição de migration já mesclada
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/check-migration-immutability.mjs

      - name: Bloquear referências de runtime sem objeto correspondente no banco
        run: node scripts/db/check-runtime-refs.mjs

      - name: Verificar dependências e autorização das Edge Functions
        run: |
          npm run check:npm-audit
          node scripts/check-edge-authorization.mjs

      - name: Executar cenários de arquitetura e segurança
        run: npm run test:scenarios

      - name: Executar a suíte completa com gate de cobertura
        run: npm run test:coverage:ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos das funções de fronteira alteradas
        run: |
          deno check supabase/functions/external-db-bridge/index.ts
          deno check supabase/functions/external-db-inspect/index.ts
          deno check supabase/functions/categories-api/index.ts
          deno check supabase/functions/materials-api/index.ts
          deno check supabase/functions/commemorative-dates/index.ts
          deno check supabase/functions/health-check/index.ts
          deno check supabase/functions/expert-chat/index.ts
          deno check supabase/functions/auth-integrity-check/index.ts
          deno check supabase/functions/sicoob-reorder/index.ts
          deno check supabase/functions/sicoob-kit-quote/index.ts
          deno check supabase/functions/sicoob-artwork-register/index.ts
          deno check supabase/functions/_shared/authorize.ts
          deno check supabase/functions/admin-audit-hook/index.ts
          deno check supabase/functions/quote-approval/index.ts
          deno check supabase/functions/quote-public-view/index.ts
          deno check supabase/functions/sicoob-approval-notifications/index.ts
          deno check supabase/functions/send-transactional-email/index.ts
          deno check supabase/functions/step-up-verify/index.ts
          deno check supabase/functions/migration-health-check/index.ts
          deno check supabase/functions/product-webhook/index.ts
          deno check supabase/functions/mcp-keys-revoke/index.ts

      - name: Simular atomicidade da verba em PostgreSQL descartável
        run: python3 scripts/qa/simular-verba-atomica.py

      - name: Simular controles de auditoria e permissões em PostgreSQL descartável
        run: python3 scripts/qa/simular-controles-auditoria.py

      - name: Simular ACL padrão, sobrecargas e herança de papéis
        run: python3 scripts/qa/simular-acl-efetiva.py

      - name: Verificar adoção de logging nas Edge Functions
        run: node scripts/check-edge-structured-logging.mjs

      - name: Simular aprovação pública, RLS e respostas concorrentes
        run: python3 scripts/qa/simular-aprovacao-publica.py

      - name: Simular fila durável de aprovação e falhas de entrega
        run: python3 scripts/qa/simular-outbox-aprovacao.py

      - name: Simular agendamento seguro da outbox via Vault
        run: python3 scripts/qa/simular-agendamento-outbox.py

      - name: Simular conversão atômica de orçamento em pedido Sicoob
        run: python3 scripts/qa/simular-conversao-pedido-sicoob.py

      - name: Simular integridade dos documentos Sicoob
        run: python3 scripts/qa/simular-documentos-sicoob.py

      - name: Simular consolidação atômica dos orçamentos
        run: python3 scripts/qa/simular-consolidacao-orcamentos.py

      - name: Compilar artefato de produção
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:59999
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-sintetica-apenas-para-build
        run: |
          npm run build
          if grep -R --include='*.js' -F 'Demonstração local · dados fictícios' dist; then
            echo 'A demonstração local foi incluída no artefato de produção.' >&2
            exit 1
          fi
          if find dist -type f -name 'produtos-grid-v1*' | grep -q .; then
            echo 'Um ativo com produtos fictícios foi incluído no artefato de produção.' >&2
            exit 1
          fi
