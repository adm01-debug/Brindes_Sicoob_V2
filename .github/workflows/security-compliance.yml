name: Security & RLS Compliance

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  rls-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Run RLS Compliance Scan
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bun scripts/scan-rls-security.mjs > rls-compliance-report.txt
          cat rls-compliance-report.txt

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: rls-compliance-report
          path: rls-compliance-report.txt
