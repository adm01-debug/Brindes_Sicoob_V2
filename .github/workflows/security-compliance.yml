name: Enterprise Compliance & Audit Reporting

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan every Sunday
  workflow_dispatch:

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Database RLS Scan
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/scan-rls-security.mjs > reports/rls-status.txt

      - name: Security Definer ACL Scan
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:security-definer-acl

      - name: Cross-Organization Access Test
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          RLS_TEST_USER_A_EMAIL: ${{ secrets.RLS_TEST_USER_A_EMAIL }}
          RLS_TEST_USER_A_PASSWORD: ${{ secrets.RLS_TEST_USER_A_PASSWORD }}
          RLS_TEST_USER_B_EMAIL: ${{ secrets.RLS_TEST_USER_B_EMAIL }}
          RLS_TEST_USER_B_PASSWORD: ${{ secrets.RLS_TEST_USER_B_PASSWORD }}
          RLS_TEST_PRIVATE_QUOTE_B_ID: ${{ secrets.RLS_TEST_PRIVATE_QUOTE_B_ID }}
        run: |
          node scripts/test-rls-compliance.mjs > reports/rls-cross-check.txt

      - name: Generate Audit Dossier V5
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-audit-dossier.mjs
          node scripts/validate-audit-links.mjs
          node scripts/test-audit-scripts.mjs

      - name: Generate PDF Report
        run: |
          # If a markdown-to-pdf tool was available, we would run it here. 
          # For now we ensure the .md is clean and artifact-ready.
          cp DOSSIA_AUDITORIA_ENTERPRISE_V5.md reports/dossier-v5.md

      - name: Generate Filtered Audit Exports
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/audit-export.mjs --status=implementado --module=Segurança
          node scripts/audit-export.mjs --status=a-implementar

      - name: Upload Enterprise Audit Bundle
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-compliance-v10
          path: |
            reports/
            DOSSIA_AUDITORIA_ENTERPRISE_V5.md
            ENTERPRISE_AUDIT_REPORT_V6.md
            AUDIT_EXPORT_FILTERED.md
            FINAL_ENTERPRISE_AUDIT_REPORT.md

