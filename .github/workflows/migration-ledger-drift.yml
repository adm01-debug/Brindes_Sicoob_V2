# Compara versões, nomes e conteúdo nos dois sentidos; pendências exigem classificação.
# Usa a Management API para não depender da resolução IPv6 do host PostgreSQL.
name: Migration ledger drift

on:
  schedule:
    - cron: '0 6 * * *' # diário, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar secret obrigatório
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado."
            exit 1
          fi

      - name: Comparar ledger remoto contra arquivos locais
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db/check-migration-ledger-drift.mjs

      - name: Auditar RLS das tabelas centrais
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db/audit-core-rls.mjs
