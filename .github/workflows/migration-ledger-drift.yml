# Compara versões, nomes e conteúdo nos dois sentidos; pendências exigem classificação.
# Usa a Management API para não depender da resolução IPv6 do host PostgreSQL.
name: Migration ledger drift

on:
  schedule:
    - cron: '0 6 * * *' # diário, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: construction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar secret obrigatório
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado."
            exit 1
          fi

      - name: Comparar ledger remoto contra arquivos locais
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db/check-migration-ledger-drift.mjs --baseline-file scripts/db/migration-ledger-baseline.json

      - name: Auditar RLS das tabelas centrais
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/db/audit-core-rls.mjs
