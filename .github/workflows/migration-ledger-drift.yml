# Compara versões, nomes e conteúdo nos dois sentidos; pendências exigem classificação.
# SUPABASE_DB_URL deve usar TLS com certificado verificado no ambiente remoto.
name: Migration ledger drift

on:
  schedule:
    - cron: '0 6 * * *' # diário, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Comparar ledger remoto contra arquivos locais
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/db/check-migration-ledger-drift.mjs
