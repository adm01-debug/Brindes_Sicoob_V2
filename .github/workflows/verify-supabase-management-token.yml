name: Verificar token de gerenciamento Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    name: Validar acesso ao projeto Sicoob
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cfmzkthhgliqelozlmwu
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Consultar metadados sem expor a credencial
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"

          status="$({
            curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF"
          })"

          if [ "$status" != '200' ]; then
            echo "O token não possui acesso de gerenciamento ao projeto Sicoob (HTTP $status)."
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const project = JSON.parse(fs.readFileSync("response.json", "utf8"));
            if (project.ref !== process.env.PROJECT_REF) process.exit(1);
            console.log("Token validado para o projeto Sicoob.");
          '
