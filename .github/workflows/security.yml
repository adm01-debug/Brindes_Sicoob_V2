name: Security Scan

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/CODEOWNERS'
      - 'reports/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/CODEOWNERS'
      - 'reports/**'
  schedule:
    # Toda segunda-feira às 06:30 (UTC) — 03:30 BRT
    - cron: '30 6 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: /tmp
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
