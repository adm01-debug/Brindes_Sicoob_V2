<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003641" />
    <title>Portal Sicoob — sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; color: #003641; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2.5rem; box-sizing: border-box; border: 1px solid #d9e5e1; border-radius: 1.25rem; background: #fff; box-shadow: 0 1rem 3rem rgba(0, 54, 65, .08); }
      strong { color: #00a091; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: .75rem 0; font-size: clamp(1.75rem, 5vw, 2.4rem); }
      p { line-height: 1.6; color: #48646a; }
      button { margin-top: 1rem; border: 0; border-radius: .75rem; padding: .8rem 1rem; background: #00a091; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main data-testid="offline-fallback">
      <strong>Portal de Brindes Sicoob</strong>
      <h1>Você está sem conexão</h1>
      <p>Assim que a internet voltar, recarregue a página para retomar sua solicitação com os dados mais recentes.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
