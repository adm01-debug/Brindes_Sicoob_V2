    <!-- Security Headers -->
    <!--
      Os cabeçalhos abaixo são entregues como HTTP headers reais via `public/_headers`
      (X-Frame-Options, Strict-Transport-Security, frame-ancestors da CSP e cabeçalhos
      relacionados). Aqui mantemos apenas as diretivas que funcionam corretamente
      como <meta http-equiv> — o navegador ignora as demais e emite warnings no
      console do preview.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(self), geolocation=(), payment=()" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://ip-api.com https://*.lovable.app https://*.lovableproject.com;
      base-uri 'self';
      form-action 'self';
    " />
