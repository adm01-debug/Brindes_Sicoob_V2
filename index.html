  <body>
    <div id="root">
      <!-- SSR-like Initial State / Critical Loader -->
      <style>
        .initial-splash {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: #003641; display: flex; flex-direction: column;
          align-items: center; justify-content: center; z-index: 9999;
          transition: opacity 0.4s ease-out;
        }
        .initial-splash.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
          width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
          border-top-color: #fff; border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div id="initial-splash" class="initial-splash">
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      // Runtime config + backward compatibility for previously generated bundles.
      // Some stale/minified artifacts referenced SUPABASE_URL as a bare global
      // identifier. Defining these globals before the module entrypoint prevents
      // a fatal ReferenceError while the new cache-safe bundle takes over.
      (function () {
        function normalizeEnv(value) {
          return value && !value.startsWith('%VITE_') ? value : undefined;
        }

        var runtimeConfig = {
          url: normalizeEnv("%VITE_SUPABASE_URL%"),
          publishableKey: normalizeEnv("%VITE_SUPABASE_PUBLISHABLE_KEY%")
        };

        window.__PORTAL_SICOOB_RUNTIME_CONFIG__ = runtimeConfig;
        window.SUPABASE_URL = runtimeConfig.url;
        window.SUPABASE_PUBLISHABLE_KEY = runtimeConfig.publishableKey;
        window.SUPABASE_ANON_KEY = runtimeConfig.publishableKey;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remover splash logo que o React hidratar (emissão de evento customizado ou timeout de segurança)
      window.addEventListener('load', function() {
        const splash = document.getElementById('initial-splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => splash.remove(), 500);
        }
      });
    </script>
