    <style>
      .initial-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #003641; z-index: 9999;
      }
      .initial-splash__content {
        width: min(88vw, 420px); text-align: center; color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      .initial-splash__eyebrow {
        margin: 0 0 12px; color: #c9d200; font-size: 12px; font-weight: 700;
        letter-spacing: .2em; text-transform: uppercase;
      }
      .initial-splash__title {
        margin: 0; font-size: clamp(28px, 8vw, 40px); line-height: 1.08;
        font-weight: 700; letter-spacing: -.025em;
      }
      .initial-splash__status {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        margin: 22px 0 0; color: rgba(255,255,255,.78); font-size: 14px;
      }
      .spinner {
        width: 22px; height: 22px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
    <script>
      // Runtime config + backward compatibility for previously generated bundles.
      // Some stale/minified artifacts referenced SUPABASE_URL as a bare global
      // identifier. Defining these globals before the module entrypoint prevents
      // a fatal ReferenceError while the new cache-safe bundle takes over.
      function normalizePortalEnv(value) {
        return value && !value.startsWith('%VITE_') ? value : undefined;
      }

      var __portalSicoobRuntimeConfig = {
        url: normalizePortalEnv("%VITE_SUPABASE_URL%"),
        publishableKey: normalizePortalEnv("%VITE_SUPABASE_PUBLISHABLE_KEY%")
      };

      window.__PORTAL_SICOOB_RUNTIME_CONFIG__ = __portalSicoobRuntimeConfig;

      // Compatibilidade máxima com bundles antigos minificados que acessavam
      // SUPABASE_URL como identificador global nu dentro de módulos. Como este
      // script clássico executa no escopo global, `var` cria um binding global
      // real; apenas `window.SUPABASE_URL = ...` pode não bastar para módulos.
      var SUPABASE_URL = __portalSicoobRuntimeConfig.url || '';
      var SUPABASE_PUBLISHABLE_KEY = __portalSicoobRuntimeConfig.publishableKey || '';
      var SUPABASE_ANON_KEY = __portalSicoobRuntimeConfig.publishableKey || '';

      window.SUPABASE_URL = SUPABASE_URL;
      window.SUPABASE_PUBLISHABLE_KEY = SUPABASE_PUBLISHABLE_KEY;
      window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remover splash logo que o React hidratar (emissão de evento customizado ou timeout de segurança)
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('initial-splash');
          if (splash) splash.remove();
        }, 2000);
      });
    </script>
  </head>
  <body>
    <div id="initial-splash" class="initial-splash" role="status" aria-live="polite">
      <div class="initial-splash__content">
        <p class="initial-splash__eyebrow">Compras institucionais</p>
        <p class="initial-splash__title">Portal de brindes Sicoob</p>
        <p class="initial-splash__status"><span class="spinner" aria-hidden="true"></span>Preparando seu acesso</p>
      </div>
    </div>
    <noscript>Ative o JavaScript no navegador para acessar o portal de compras.</noscript>
    <div id="root"></div>
  </body>
